
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senko Executor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090d16;
  color: white;
  font-family: Arial, sans-serif;
  padding: 18px;
}

header {
  padding: 12px 0 20px;
}

h2 {
  color: #8b7cff;
  margin-bottom: 5px;
}

.editor {
  width: 100%;
  height: 300px;
  background: #111827;
  color: #a5f3fc;
  border: 1px solid #293449;
  border-radius: 10px;
  padding: 14px;
  resize: vertical;
  font-family: monospace;
  font-size: 14px;
  outline: none;
}

button {
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
  background: #7663ff;
  color: white;
  font-weight: bold;
  margin: 10px 5px 10px 0;
}

.clear {
  background: #293449;
}

.console {
  background: #111827;
  border: 1px solid #293449;
  padding: 14px;
  border-radius: 10px;
  min-height: 110px;
  font-family: monospace;
  color: #86efac;
  overflow-wrap: anywhere;
}

small {
  color: #8792a8;
}
</style>
</head>

<body>

<header>
  <h2>⚡ SENKO EXECUTOR</h2>
  <small>Lua Educational Environment</small>
</header>

<h3>Script Editor</h3>

<textarea id="editor" class="editor"
spellcheck="false">print("Hello Senko!")</textarea>

<br>

<button onclick="runScript()">▶ Run</button>
<button class="clear" onclick="clearConsole()">Clear</button>

<h3>Console</h3>

<div class="console" id="console">
Senko Executor initialized...
</div>

<script>
function runScript() {
  const output = document.getElementById("console");

  output.textContent =
    "Lua engine belum terpasang. Menunggu integrasi interpreter...";
}

function clearConsole() {
  document.getElementById("console").textContent = "";
}
</script>

</body>
  </html>
